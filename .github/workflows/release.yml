name: release

# Publie @hammerbot/job-runner sur npm à chaque GitHub Release publiée.
# Prérequis : un secret repo `NPM_TOKEN` (npm automation token du compte/org
# propriétaire du scope @hammerbot). Le build (dist/ : serveur compilé +
# dashboard Vite + migrations) est régénéré par le script `prepack` au packaging,
# donc rien n'est bundlé à la main.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
